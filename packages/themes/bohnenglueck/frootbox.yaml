title: 'Bohnenglück'
description: 'Demo-Theme: Website einer kleinen Kaffeerösterei'
theme:
  parent: frootbox/theme-base
  navigations:
    main:
      title: Hauptnavigation
      options:
        button: { type: boolean, label: Als Button }
    footer: Footer
  # Content that is the same on every page (decision 0128).
  fields:
    brand: { type: headline, label: Name der Website, maxLength: 60 }
    address: { type: text, label: Adresse im Footer, maxLength: 200 }
    note: { type: text, label: Hinweis im Footer, maxLength: 200 }
  tokens:
    color:
      bg: '#fbf7f2'
      surface: '#ffffff'
      text: '#2b211c'
      muted: '#6f625a'
      primary: '#8a4b2a'
      primary-contrast: '#ffffff'
      accent: '#e8b04b'
      dark: '#2b211c'
      line: '#e7ddd3'
    font:
      body: sans
      heading: serif
    radius: 14px
    space: normal
    width: 72rem
    leading:
      body: 1.6
      heading: 1.15
  # Content in Arabic or Hebrew, also as fallback on a page of another
  # language, gets fonts with its letters and more room between lines
  # (decision 0159).
  scripts:
    arab:
      font:
        body: '"Noto Naskh Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif'
        heading: '"Noto Kufi Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif'
      leading:
        body: 1.9
        heading: 1.4
    hebr:
      font:
        body: '"Noto Sans Hebrew", "Arial Hebrew", "Segoe UI", Arial, sans-serif'
        heading: '"Noto Serif Hebrew", "Times New Roman", serif'
      leading:
        body: 1.75
        heading: 1.3
