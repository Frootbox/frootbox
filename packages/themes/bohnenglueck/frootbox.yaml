title: 'Bohnenglück'
description: 'Demo-Theme: Website einer kleinen Kaffeerösterei'
# A child of the base theme with its blocks, layouts, partials, fields,
# navigations and the fonts for Arabic and Hebrew (decisions 0164, 0188).
# Bohnenglück only brings its tokens, a few symbols in icons/ and
# assets/site.css, which dresses the classes of the base theme in the
# colours of the roastery.
theme:
  parent: frootbox/theme-base
  tokens:
    color:
      bg: '#fbf7f2'
      surface: '#ffffff'
      text: '#2b211c'
      muted: '#6f625a'
      primary: '#8a4b2a'
      primary-contrast: '#ffffff'
      accent: '#e8b04b'
      focus: '#8a4b2a'
      dark: '#2b211c'
      line: '#e7ddd3'
    font:
      body: sans
      heading: serif
    radius: 14px
    space: normal
    width: 72rem
    leading:
      body: 1.6
      heading: 1.15
