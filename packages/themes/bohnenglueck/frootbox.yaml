title: 'Bohnenglück'
description: 'Demo-Theme: Website einer kleinen Kaffeerösterei'
theme:
  parent: frootbox/theme-base
  # Until it is built on the base theme (decision 0164), Bohnenglück keeps
  # its own layouts, partials and their styles (the empty partials.css),
  # and its own blocks instead of those of the library that do the same.
  layouts:
    hide: [frootbox/theme-base/Page, frootbox/theme-base/Start, frootbox/theme-base/Landing]
  blocks:
    hide:
      - frootbox/theme-base/TextWithHeading
      - frootbox/theme-base/Quote
      - frootbox/theme-base/Notice
      - frootbox/theme-base/Divider
      - frootbox/theme-base/CallToAction
      - frootbox/theme-base/KeyFigures
      - frootbox/theme-base/Hero
      - frootbox/theme-base/PageHeader
      - frootbox/theme-base/ImageWithText
      - frootbox/theme-base/Gallery
      - frootbox/theme-base/Slider
  navigations:
    main:
      title: Main navigation
      options:
        button: { type: boolean, label: As a button }
    footer: Footer
  # Content that is the same on every page (decision 0128).
  fields:
    brand: { type: headline, label: Name of the website, maxLength: 60 }
    address: { type: text, label: Address in the footer, maxLength: 200 }
    note: { type: text, label: Note in the footer, maxLength: 200 }
  tokens:
    color:
      bg: '#fbf7f2'
      surface: '#ffffff'
      text: '#2b211c'
      muted: '#6f625a'
      primary: '#8a4b2a'
      primary-contrast: '#ffffff'
      accent: '#e8b04b'
      dark: '#2b211c'
      line: '#e7ddd3'
    font:
      body: sans
      heading: serif
    radius: 14px
    space: normal
    width: 72rem
    leading:
      body: 1.6
      heading: 1.15
  # Content in Arabic or Hebrew, also as fallback on a page of another
  # language, gets fonts with its letters and more room between lines
  # (decision 0159).
  scripts:
    arab:
      font:
        body: '"Noto Naskh Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif'
        heading: '"Noto Kufi Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif'
      leading:
        body: 1.9
        heading: 1.4
    hebr:
      font:
        body: '"Noto Sans Hebrew", "Arial Hebrew", "Segoe UI", Arial, sans-serif'
        heading: '"Noto Serif Hebrew", "Times New Roman", serif'
      leading:
        body: 1.75
        heading: 1.3
