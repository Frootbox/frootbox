# German texts of the collections: labels of the blocks, texts for visitors and the screen (decisions 0161, 0246).
"Collections": "Sammlungen"
"Collection": "Sammlung"
"Categories of the collections": "Kategorien der Sammlungen"
"The entries of the collection the page shows as cards with image, title and teaser, filtered by category and tag. Each entry gets its own address below the page with image and text, optionally with a form for requests.": "Die Einträge der Sammlung, die die Seite zeigt, als Karten mit Bild, Titel und Kurztext, filterbar nach Kategorie und Schlagwort. Jeder Eintrag bekommt eine eigene Adresse unter der Seite mit Bild und Text, auf Wunsch mit einem Formular für Anfragen."
"Entries of a collection": "Einträge einer Sammlung"
"Some entries of a collection as cards, e.g. the references on the start page, with a link to all of them.": "Einige Einträge einer Sammlung als Karten, z. B. die Referenzen auf der Startseite, mit einem Link auf alle."
"Form for requests": "Formular für Anfragen"
"Images in the list": "Bilder in der Liste"
"Images": "Bilder"
"Filter the list": "Liste filtern"
"Number of entries": "Anzahl der Einträge"
"Only of the category": "Nur aus der Kategorie"
"Only with the tag": "Nur mit dem Schlagwort"
"Any": "Alle"
"Heading": "Überschrift"
"References": "Referenzen"
# Website
"All": "Alle"
"All entries": "Alle Einträge"
"Tag": "Schlagwort"
"Category": "Kategorie"
"Categories": "Kategorien"
"No entries match this choice.": "Zu dieser Auswahl gibt es keine Einträge."
"There are no entries yet.": "Hier gibt es noch keine Einträge."
# Backend (decisions 0220, 0246)
"Entries": "Einträge"
"New entry": "Neuer Eintrag"
"References, projects and the like, each collection with entries of the same kind. A page shows a collection as cards, each entry gets its own address.": "Referenzen, Projekte und Ähnliches, jede Sammlung mit gleichartigen Einträgen. Eine Seite zeigt eine Sammlung als Karten, jeder Eintrag bekommt eine eigene Adresse."
"No entries yet": "Noch keine Einträge"
"Position {order}": "Position {order}"
"The entry is saved as a draft.": "Der Eintrag ist als Entwurf gespeichert."
"The entry is published.": "Der Eintrag ist veröffentlicht."
"Visitors in this language do not see the entry.": "Besucher in dieser Sprache sehen den Eintrag nicht."
"The entry goes offline by itself.": "Der Eintrag geht von selbst offline."
"Only for a published entry.": "Nur für einen veröffentlichten Eintrag."
"Delete the entry": "Eintrag löschen"
"Your changes to this entry are lost. The published version stays.": "Deine Änderungen an diesem Eintrag gehen verloren. Die veröffentlichte Fassung bleibt."
"The entry was never published and is gone afterwards.": "Der Eintrag war nie veröffentlicht und ist danach weg."
"The entry is offline.": "Der Eintrag ist offline."
"Visitors no longer find the entry. It stays as a draft and can be published again.": "Besucher finden den Eintrag nicht mehr. Er bleibt als Entwurf und lässt sich wieder veröffentlichen."
"The entry is deleted.": "Der Eintrag ist gelöscht."
"The entry leaves the list and the website. Visitors no longer find it.": "Der Eintrag verschwindet aus der Liste und von der Website. Besucher finden ihn nicht mehr."
"E.g. the name of the project or the customer.": "Z. B. der Name des Projekts oder des Kunden."
"The last part of the address of the entry. If it changes, the old one redirects to the new one.": "Der letzte Teil der Adresse des Eintrags. Ändert er sich, leitet die alte Adresse auf die neue weiter."
"A few sentences for the cards and for search engines.": "Ein paar Sätze für die Karten und für Suchmaschinen."
"Position": "Position"
"Smaller numbers come first. With the same number the newest comes first.": "Kleinere Zahlen kommen zuerst. Bei gleicher Zahl kommt der neueste zuerst."
"Create the first one. It stays a draft until you publish it.": "Leg den ersten an. Er bleibt ein Entwurf, bis Du ihn veröffentlichst."
"Without a title": "Ohne Titel"
"Previous": "Zurück"
"Next": "Weiter"
"Save as a draft": "Als Entwurf speichern"
"Teaser": "Anriss"
"There is no such collection.": "Diese Sammlung gibt es nicht."
