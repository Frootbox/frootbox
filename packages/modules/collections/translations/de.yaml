# German texts of the collections: labels of the blocks, texts for visitors and the screen (decisions 0161, 0246).
"Collections": "Sammlungen"
"Collection": "Sammlung"
"Categories of the collections": "Kategorien der Sammlungen"
"The entries of the collection the page shows as cards with image, title and teaser, filtered by category and tag. Each entry gets its own address below the page with image, the fields of the collection as a fact sheet and text, optionally with a form for requests.": "Die Einträge der Sammlung, die die Seite zeigt, als Karten mit Bild, Titel und Kurztext, filterbar nach Kategorie und Schlagwort. Jeder Eintrag bekommt eine eigene Adresse unter der Seite mit Bild, den Feldern der Sammlung als Steckbrief und Text, auf Wunsch mit einem Formular für Anfragen."
"Entries of a collection": "Einträge einer Sammlung"
"Some entries of a collection as cards, e.g. the references on the start page, with a link to all of them.": "Einige Einträge einer Sammlung als Karten, z. B. die Referenzen auf der Startseite, mit einem Link auf alle."
"Form for requests": "Formular für Anfragen"
"Images in the list": "Bilder in der Liste"
"Images": "Bilder"
"Filter the list": "Liste filtern"
"Number of entries": "Anzahl der Einträge"
"Only of the category": "Nur aus der Kategorie"
"Only with the tag": "Nur mit dem Schlagwort"
"Any": "Alle"
"Heading": "Überschrift"
"References": "Referenzen"
# Website
"All": "Alle"
"All entries": "Alle Einträge"
"Tag": "Schlagwort"
"Category": "Kategorie"
"Categories": "Kategorien"
"No entries match this choice.": "Zu dieser Auswahl gibt es keine Einträge."
"There are no entries yet.": "Hier gibt es noch keine Einträge."
"Yes": "Ja"
"No": "Nein"
# Backend (decisions 0220, 0246)
"Entries": "Einträge"
"New entry": "Neuer Eintrag"
"References, projects and the like, each collection with entries of the same kind. A page shows a collection as cards, each entry gets its own address.": "Referenzen, Projekte und Ähnliches, jede Sammlung mit gleichartigen Einträgen. Eine Seite zeigt eine Sammlung als Karten, jeder Eintrag bekommt eine eigene Adresse."
"No entries yet": "Noch keine Einträge"
"Position {order}": "Position {order}"
"The entry is saved as a draft.": "Der Eintrag ist als Entwurf gespeichert."
"The entry is published.": "Der Eintrag ist veröffentlicht."
"Visitors in this language do not see the entry.": "Besucher in dieser Sprache sehen den Eintrag nicht."
"The entry goes offline by itself.": "Der Eintrag geht von selbst offline."
"Only for a published entry.": "Nur für einen veröffentlichten Eintrag."
"Delete the entry": "Eintrag löschen"
"Your changes to this entry are lost. The published version stays.": "Deine Änderungen an diesem Eintrag gehen verloren. Die veröffentlichte Fassung bleibt."
"The entry was never published and is gone afterwards.": "Der Eintrag war nie veröffentlicht und ist danach weg."
"The entry is offline.": "Der Eintrag ist offline."
"Visitors no longer find the entry. It stays as a draft and can be published again.": "Besucher finden den Eintrag nicht mehr. Er bleibt als Entwurf und lässt sich wieder veröffentlichen."
"The entry is deleted.": "Der Eintrag ist gelöscht."
"The entry leaves the list and the website. Visitors no longer find it.": "Der Eintrag verschwindet aus der Liste und von der Website. Besucher finden ihn nicht mehr."
"E.g. the name of the project or the customer.": "Z. B. der Name des Projekts oder des Kunden."
"The last part of the address of the entry. If it changes, the old one redirects to the new one.": "Der letzte Teil der Adresse des Eintrags. Ändert er sich, leitet die alte Adresse auf die neue weiter."
"A few sentences for the cards and for search engines.": "Ein paar Sätze für die Karten und für Suchmaschinen."
"Position": "Position"
"Smaller numbers come first. With the same number the newest comes first.": "Kleinere Zahlen kommen zuerst. Bei gleicher Zahl kommt der neueste zuerst."
"Create the first one. It stays a draft until you publish it.": "Leg den ersten an. Er bleibt ein Entwurf, bis Du ihn veröffentlichst."
"Without a title": "Ohne Titel"
"Previous": "Zurück"
"Next": "Weiter"
"Save as a draft": "Als Entwurf speichern"
"Teaser": "Anriss"
"There is no such collection.": "Diese Sammlung gibt es nicht."
# Fields of a collection (decision 0250)
"Add a field": "Feld hinzufügen"
"Edit the field": "Feld bearbeiten"
"What each entry of the collection can have, e.g. the area or the year. Editors fill them in, the page of an entry shows them as a fact sheet.": "Was jeder Eintrag der Sammlung haben kann, z. B. die Fläche oder das Jahr. Redakteure füllen sie aus, die Seite eines Eintrags zeigt sie als Steckbrief."
"No fields yet": "Noch keine Felder"
"Add what the entries have in common, e.g. \"Area\" as a number in m² or \"Year\".": "Leg an, was die Einträge gemeinsam haben, z. B. „Fläche“ als Zahl in m² oder „Baujahr“."
"{count} option": { one: "{count} Option", other: "{count} Optionen" }
"{count} entry": { one: "{count} Eintrag", other: "{count} Einträge" }
"Move {name} up": "{name} nach oben"
"Move {name} down": "{name} nach unten"
"Edit {name}": "{name} bearbeiten"
"Moved": "Verschoben"
"Add": "Hinzufügen"
"Kind": "Art"
"Name and kind stay. For another kind add a new field.": "Name und Art bleiben. Für eine andere Art leg ein neues Feld an."
"In {language}.": "Auf {language}."
"In the order of {language}.": "In der Reihenfolge von {language}."
"Unit": "Einheit"
"Only for a number, e.g. \"m²\" or \"%\".": "Nur für eine Zahl, z. B. „m²“ oder „%“."
"Decimal places": "Nachkommastellen"
"Only for a number. Empty or 0 for whole numbers.": "Nur für eine Zahl. Leer oder 0 für ganze Zahlen."
"Only for a choice from a list: one option per line.": "Nur für eine Auswahl aus einer Liste: eine Option je Zeile."
"The field is added.": "Das Feld ist hinzugefügt."
"The field is removed.": "Das Feld ist entfernt."
"Remove {name}?": "{name} entfernen?"
"One entry has a value in it. It stays saved and comes back with a new field of the same name.": { one: "Ein Eintrag hat einen Wert darin. Er bleibt gespeichert und kommt mit einem neuen Feld gleichen Namens zurück.", other: "{count} Einträge haben einen Wert darin. Sie bleiben gespeichert und kommen mit einem neuen Feld gleichen Namens zurück." }
"No entry has a value in it yet.": "Noch kein Eintrag hat einen Wert darin."
"Text": "Text"
"Long text": "Langer Text"
"Number": "Zahl"
"Date": "Datum"
"Yes or no": "Ja oder Nein"
"Link": "Link"
"Choice from a list": "Auswahl aus einer Liste"
"Image": "Bild"
"File": "Datei"
"is missing: the label in {language}.": "fehlt: die Beschriftung auf {language}."
"cannot be empty: the label in {language}.": "darf nicht leer sein: die Beschriftung auf {language}."
"The collection or the theme has a field \"{name}\" already.": "Die Sammlung oder das Theme hat schon ein Feld „{name}“."
"must be a text of at most {count} characters.": "muss ein Text mit höchstens {count} Zeichen sein."
"must be at most {count} characters, e.g. \"m²\".": "darf höchstens {count} Zeichen haben, z. B. „m²“."
"must be from 0 to 6.": "muss zwischen 0 und 6 liegen."
"is missing: the options by language, one per line, e.g. {\"{language}\": [\"Arabica\", \"Robusta\"]}.": "fehlt: die Optionen je Sprache, eine je Zeile, z. B. {\"{language}\": [\"Arabica\", \"Robusta\"]}."
"must be a list of texts, e.g. [\"Arabica\", \"Robusta\"].": "muss eine Liste von Texten sein, z. B. [\"Arabica\", \"Robusta\"]."
"needs from 1 to {count} options.": "braucht 1 bis {count} Optionen."
"has more lines than the options in {language}.": "hat mehr Zeilen als die Optionen auf {language}."
