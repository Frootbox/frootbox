# German texts of Anthropic: the settings and the errors of the API (decision 0294).
"Anthropic": "Anthropic"
"The API key and the model of Claude for the AI of the website": "Der API-Schlüssel und das Modell von Claude für die KI der Website"
"API key": "API-Schlüssel"
"The key from the console of Anthropic (platform.claude.com). ANTHROPIC_API_KEY in .env comes first.": "Der Schlüssel aus der Konsole von Anthropic (platform.claude.com). ANTHROPIC_API_KEY in der .env hat Vorrang."
"Model": "Modell"
"claude-opus-5-5 (the best, standard), claude-sonnet-5-5 (half the price) or claude-haiku-5-5 (fast and very cheap).": "claude-opus-5-5 (das beste, Standard), claude-sonnet-5-5 (halber Preis) oder claude-haiku-5-5 (schnell und sehr günstig)."
"The API key of Anthropic is missing.": "Der API-Schlüssel von Anthropic fehlt."
"Anthropic does not accept the API key. Please check it in the settings.": "Anthropic nimmt den API-Schlüssel nicht an. Bitte prüfe ihn in den Einstellungen."
"The API key of Anthropic may not use this model.": "Der API-Schlüssel von Anthropic darf dieses Modell nicht nutzen."
"Anthropic gets too many requests from this account right now. Please try again in a minute.": "Anthropic bekommt gerade zu viele Anfragen von diesem Konto. Bitte versuche es in einer Minute noch einmal."
"Anthropic cannot answer right now. Please try again later.": "Anthropic kann gerade nicht antworten. Bitte versuche es später noch einmal."
"Anthropic refuses the request: {reason}": "Anthropic lehnt die Anfrage ab: {reason}"
"Anthropic cannot be reached. Please check the connection of the server.": "Anthropic ist nicht erreichbar. Bitte prüfe die Verbindung des Servers."
"Anthropic does not read images of the type {type}.": "Anthropic liest keine Bilder vom Typ {type}."
