name: Idea
description: Something Frootbox should do or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to achieve
      description: The task or the problem, not yet the solution. Who needs it, editors or developers?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another CMS, a module of your own.
