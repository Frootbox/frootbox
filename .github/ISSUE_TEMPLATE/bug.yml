name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did and what went wrong. Error messages and log lines from var/log/ help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As short as possible, ideally from a new project (composer create-project frootbox/skeleton).
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: Output of php bin/frootbox about
      render: text
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Web server and hosting
      placeholder: e.g. Apache on shared hosting, nginx, php -S
