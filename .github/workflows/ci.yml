name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - name: Validate composer.json files
        run: |
          composer validate --strict
          for file in packages/*/composer.json packages/*/*/composer.json; do
            composer validate --strict --no-check-lock "$file"
          done
      - uses: ramsey/composer-install@v3
      - run: composer cs

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer stan

  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
        env:
          DATABASE_URL: 'pdo-sqlite:///:memory:'

  tests-server:
    name: Tests (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -proot
          - name: MariaDB 10.11
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: frootbox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
        env:
          DATABASE_URL: 'pdo-mysql://root:root@127.0.0.1:3306/frootbox'

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          coverage: none
      # tools/sandbox.php reads sandbox.env and checks the superuser with the packages of the repository.
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds var/e2e/ with the demo website and serves it (tools/e2e.php).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            test-results/
            var/e2e/var/log/
          retention-days: 7

  backend-assets:
    name: Backend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only tokens in the CSS of the backend (decisions 0113, 0114).
      - run: npm run lint:css
      # The built files are in Git (decision 0111) and must match the sources.
      - run: npm run build
      - name: Built files are up to date
        run: |
          if [ -n "$(git status --porcelain -- packages/backend/assets/build)" ]; then
            git status --short -- packages/backend/assets/build
            echo "::error::packages/backend/assets/build is behind resources/js. Run npm run build and commit the result."
            exit 1
          fi

  screenshot-tests:
    name: Screenshot tests
    runs-on: ubuntu-latest
    # The same container as `npm run test:visual`, so the images match.
    # Keep its version equal to @playwright/test in package-lock.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Approved screenshots
        id: approved
        run: |
          if [ -d tests/e2e/__screenshots__ ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No approved screenshots yet. Run the workflow \"Update screenshots\" and commit its images to tests/e2e/__screenshots__/."
          fi
      - if: steps.approved.outputs.found == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite
          coverage: none
      - if: steps.approved.outputs.found == 'true'
        uses: ramsey/composer-install@v3
      - if: steps.approved.outputs.found == 'true'
        run: npm ci
      - if: steps.approved.outputs.found == 'true'
        run: npx playwright test --project=visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff
          path: test-results/
          retention-days: 7
